<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wochenkalender</title>
    <link rel="stylesheet" href="kalender_woche.css">
    <style>
        /* Configurable calendar width - adjust as needed */
        :root {
            --calendar-width: 100%;
        }
    </style>
</head>
<body>
    <div class="calendar-container">
        <div class="header-container">
            <h1>Wochenkalender</h1>
            <div class="date-navigation">
                <button id="prevWeekBtn" class="nav-btn" title="Vorherige Woche">◄</button>
                <button id="todayBtn" class="nav-btn today-btn" title="Diese Woche">Diese Woche</button>
                <button id="nextWeekBtn" class="nav-btn" title="Nächste Woche">►</button>
                <button id="newEventBtn" class="nav-btn new-event-btn" title="Neuen Termin erstellen">+ Neuer Termin</button>
            </div>
        </div>
        <div id="currentWeekDisplay" class="current-date"></div>
        <div id="calendar" class="calendar-grid"></div>
    </div>

    <!-- Event Edit Modal -->
    <div id="eventEditModal" class="edit-modal-backdrop" style="display:none;">
        <div class="edit-modal">
            <div class="edit-modal-header">
                <h2>Termin bearbeiten</h2>
                <button id="editModalClose" class="edit-modal-close" title="Schließen">✕</button>
            </div>
            <div class="edit-modal-body">
                <input type="hidden" id="editEventId">
                <div class="edit-modal-field">
                    <label for="editEventDate">Datum</label>
                    <input type="date" id="editEventDate">
                </div>
                <div class="edit-modal-field">
                    <label for="editEventTitle">Titel</label>
                    <input type="text" id="editEventTitle" placeholder="Titel eingeben">
                </div>
                <div class="edit-modal-field">
                    <label for="editEventCategory">Kategorie</label>
                    <select id="editEventCategory">
                        <option value="1">Intern</option>
                        <option value="2">Extern</option>
                        <option value="3">Krank</option>
                        <option value="4">Urlaub</option>
                    </select>
                </div>
                <div class="edit-modal-field">
                    <label for="editEventColor">Farbe</label>
                    <input type="color" id="editEventColor">
                </div>
                <div class="edit-modal-field">
                    <label for="editEventIsAllDay">Ganztägig</label>
                    <input type="checkbox" id="editEventIsAllDay">
                </div>
                <div id="editEventDateToField" class="edit-modal-field" style="display:none;">
                    <label for="editEventDateTo">Enddatum</label>
                    <input type="date" id="editEventDateTo">
                </div>
                <div id="editEventTimeFields" class="edit-modal-time-fields">
                    <div class="edit-modal-field">
                        <label for="editEventStartTime">Startzeit</label>
                        <input type="time" id="editEventStartTime">
                    </div>
                    <div class="edit-modal-field">
                        <label for="editEventEndTime">Endzeit</label>
                        <input type="time" id="editEventEndTime">
                    </div>
                </div>
            </div>
            <div class="edit-modal-footer">
                <button id="editModalDelete" class="edit-modal-btn edit-modal-btn-delete">Löschen</button>
                <button id="editModalCancel" class="edit-modal-btn edit-modal-btn-cancel">Abbrechen</button>
                <button id="editModalSave" class="edit-modal-btn edit-modal-btn-save">Speichern</button>
            </div>
        </div>
    </div>
    <!-- New Event Modal -->
    <div id="newEventModal" class="edit-modal-backdrop" style="display:none;">
        <div class="edit-modal">
            <div class="edit-modal-header">
                <h2>Neuer Termin</h2>
                <button id="newEventModalClose" class="edit-modal-close" title="Schließen">✕</button>
            </div>
            <div class="edit-modal-body">
                <div class="edit-modal-field">
                    <label for="newEventEmployer">Mitarbeiter (mehrere auswählbar)</label>
                    <select id="newEventEmployer" multiple size="4"></select>
                </div>
                <div class="edit-modal-field">
                    <label for="newEventDate">Datum</label>
                    <input type="date" id="newEventDate">
                </div>
                <div class="edit-modal-field">
                    <label for="newEventTitle">Titel</label>
                    <input type="text" id="newEventTitle" placeholder="Titel eingeben">
                </div>
                <div class="edit-modal-field">
                    <label for="newEventCategory">Kategorie</label>
                    <select id="newEventCategory">
                        <option value="1">Intern</option>
                        <option value="2">Extern</option>
                        <option value="3">Krank</option>
                        <option value="4">Urlaub</option>
                    </select>
                </div>
                <div class="edit-modal-field">
                    <label for="newEventColor">Farbe</label>
                    <input type="color" id="newEventColor" value="#4a90e2">
                </div>
                <div class="edit-modal-field">
                    <label for="newEventIsAllDay">Ganztägig</label>
                    <input type="checkbox" id="newEventIsAllDay">
                </div>
                <div id="newEventDateToField" class="edit-modal-field" style="display:none;">
                    <label for="newEventDateTo">Enddatum</label>
                    <input type="date" id="newEventDateTo">
                </div>
                <div id="newEventTimeFields" class="edit-modal-time-fields">
                    <div class="edit-modal-field">
                        <label for="newEventStartTime">Startzeit</label>
                        <input type="time" id="newEventStartTime">
                    </div>
                    <div class="edit-modal-field">
                        <label for="newEventEndTime">Endzeit</label>
                        <input type="time" id="newEventEndTime">
                    </div>
                </div>
            </div>
            <div class="edit-modal-footer">
                <button id="newEventModalCancel" class="edit-modal-btn edit-modal-btn-cancel">Abbrechen</button>
                <button id="newEventModalSave" class="edit-modal-btn edit-modal-btn-save">Erstellen</button>
            </div>
        </div>
    </div>
    <script src="kalender_woche.js"></script>
</body>
</html>
